[project]
name = "clinicfix"
version = "0.1.0"
description = "A beginner-friendly REST API for clinic equipment maintenance."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.4",
    "flask-sqlalchemy>=3.1.1",
    "psycopg[binary]>=3.3.6",
    "flask-jwt-extended==4.7.4",
    "flask-migrate>=4.1.0",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["artifacts/api-server"]
testpaths = ["artifacts/api-server/tests"]


